<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Chat</title>
<style>
/* ============================================================
   VARIABLES
   ============================================================ */
:root {
  --bg: #09090b;
  --bg-sidebar: #0c0c10;
  --bg-card: #131318;
  --bg-input: #0f0f14;
  --border: #1e1e28;
  --text: #fafafa;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --green: #10b981;
  --purple: #8b5cf6;
  --amber: #f59e0b;
  --red: #ef4444;
  --user-bubble: #1d4ed8;
  --assistant-bubble: #1e1e28;
  --tool-bg: #0f1720;
  --tool-border: #1e3a5f;
}
[data-theme="light"] {
  --bg: #f8f9fb;
  --bg-sidebar: #ffffff;
  --bg-card: #ffffff;
  --bg-input: #ffffff;
  --border: #e4e4e7;
  --text: #09090b;
  --text-secondary: #52525b;
  --text-muted: #a1a1aa;
  --user-bubble: #3b82f6;
  --assistant-bubble: #ffffff;
  --tool-bg: #f0f7ff;
  --tool-border: #bfdbfe;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
}
button { cursor: pointer; font-family: inherit; }
code, pre { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, monospace; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app { display: flex; height: 100vh; }

/* SIDEBAR */
.sidebar {
  width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.sidebar-header {
  padding: 16px; border-bottom: 1px solid var(--border);
  font-weight: 700; font-size: 0.95rem; letter-spacing: -0.02em;
}
.sidebar-header span { color: var(--accent); }
.sidebar-sessions { flex: 1; overflow-y: auto; padding: 8px; }
.session-item {
  padding: 10px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer;
  color: var(--text-secondary); margin-bottom: 2px; transition: all .12s;
  display: flex; align-items: center; gap: 8px;
}
.session-item:hover { background: var(--bg-card); color: var(--text); }
.session-item.active { background: var(--bg-card); color: var(--text); font-weight: 600; }
.session-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.session-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.new-chat-btn {
  margin: 8px; padding: 10px; border-radius: 8px; border: 1px dashed var(--border);
  background: transparent; color: var(--text-secondary); font-size: 0.82rem;
  transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.new-chat-btn:hover { border-color: var(--accent); color: var(--accent); }
.sidebar-footer {
  padding: 12px; border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.theme-btn {
  background: none; border: 1px solid var(--border); color: var(--text-secondary);
  border-radius: 6px; padding: 5px 10px; font-size: 0.75rem; transition: all .15s;
}
.theme-btn:hover { border-color: var(--text-muted); color: var(--text); }
.model-badge {
  font-size: 0.65rem; color: var(--text-muted); background: var(--bg-card);
  padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border);
}

/* MAIN CHAT */
.main {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
}
.chat-header {
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px;
}
.chat-header .status { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.chat-messages {
  flex: 1; overflow-y: auto; padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}

/* MESSAGES */
.msg { display: flex; gap: 12px; max-width: 800px; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg.assistant { align-self: flex-start; }
.msg-avatar {
  width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-size: 0.85rem; flex-shrink: 0;
}
.msg.user .msg-avatar { background: var(--user-bubble); color: #fff; }
.msg.assistant .msg-avatar { background: var(--purple); color: #fff; }
.msg-bubble {
  padding: 10px 16px; border-radius: 12px; font-size: 0.88rem; line-height: 1.65;
  word-break: break-word;
}
.msg.user .msg-bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant .msg-bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg-bubble p { margin: 0.35em 0; }
.msg-bubble p:first-child { margin-top: 0; }
.msg-bubble p:last-child { margin-bottom: 0; }
.msg-bubble pre {
  background: #0d1117; border: 1px solid #21262d; border-radius: 8px;
  padding: 12px; overflow-x: auto; font-size: 0.78rem; line-height: 1.5; margin: 8px 0;
}
.msg-bubble code { font-size: 0.82rem; background: #0d111720; padding: 1px 5px; border-radius: 3px; }
.msg-bubble pre code { background: none; padding: 0; }

/* TOOL CALLS */
.tool-call {
  background: var(--tool-bg); border: 1px solid var(--tool-border); border-radius: 8px;
  padding: 8px 12px; margin: 8px 0; font-size: 0.78rem;
}
.tool-call .tool-name {
  font-weight: 600; font-family: monospace; color: var(--accent);
  display: flex; align-items: center; gap: 6px;
}
.tool-call .tool-name .indicator { width: 5px; height: 5px; border-radius: 50%; background: var(--amber); }
.tool-call .tool-detail { color: var(--text-secondary); margin-top: 4px; font-size: 0.75rem; white-space: pre-wrap; word-break: break-all; }
.tool-call .tool-detail.collapsible { display: none; }
.tool-call .tool-detail.collapsible.open { display: block; }

/* EMPTY STATE */
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; color: var(--text-muted); gap: 12px;
}
.empty-state h2 { font-size: 1.5rem; font-weight: 700; color: var(--text-secondary); }
.empty-state p { font-size: 0.9rem; max-width: 400px; }
.empty-hints { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
.empty-hint {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
  padding: 8px 16px; font-size: 0.8rem; cursor: pointer; transition: all .15s; color: var(--text-secondary);
}
.empty-hint:hover { border-color: var(--accent); color: var(--accent); }

/* INPUT AREA */
.chat-input-area {
  padding: 16px 20px; border-top: 1px solid var(--border); background: var(--bg);
}
.input-wrapper {
  max-width: 800px; margin: 0 auto; display: flex; gap: 8px;
  background: var(--bg-input); border: 1px solid var(--border); border-radius: 14px;
  padding: 8px 8px 8px 18px; transition: border-color .15s;
}
.input-wrapper:focus-within { border-color: var(--accent); }
.input-wrapper textarea {
  flex: 1; background: none; border: none; outline: none; color: var(--text);
  font-size: 0.88rem; font-family: inherit; resize: none; padding: 6px 0;
  line-height: 1.5; max-height: 120px;
}
.input-wrapper textarea::placeholder { color: var(--text-muted); }
.send-btn {
  align-self: flex-end; padding: 8px 14px; border-radius: 10px;
  background: var(--accent); color: #fff; border: none; font-weight: 600; font-size: 0.82rem;
  transition: all .15s; display: flex; align-items: center; gap: 6px; flex-shrink: 0;
}
.send-btn:hover { background: var(--accent-hover); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.send-btn .spinner { display: none; width: 14px; height: 14px; border: 2px solid #fff3; border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
.send-btn.loading .spinner { display: block; }
.send-btn.loading .label { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* THINKING INDICATOR */
@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
.thinking { color: var(--text-muted); font-size: 0.82rem; padding: 8px 0; display: flex; align-items: center; gap: 8px; }
.thinking .pulse-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
  animation: pulse 1.5s ease-in-out infinite;
}

/* MOBILE */
@media (max-width: 640px) {
  .sidebar { display: none; }
  .sidebar.open { display: flex; position: fixed; top: 0; left: 0; bottom: 0; z-index: 50; width: 280px; }
  .chat-messages { padding: 12px; }
  .msg { max-width: 100%; }
}
.mobile-menu-btn {
  display: none; background: none; border: none; color: var(--text); font-size: 1.2rem; padding: 4px;
}
@media (max-width: 640px) {
  .mobile-menu-btn { display: block; }
}
</style>
</head>
<body>
<div class="app">

<!-- ============================================================
     SIDEBAR
     ============================================================ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">🤖 Agent <span>Chat</span></div>

  <button class="new-chat-btn" onclick="newChat()">＋ New Chat</button>

  <div class="sidebar-sessions" id="sessionList"></div>

  <div class="sidebar-footer">
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️ Light</button>
    <span class="model-badge" id="modelBadge">...</span>
  </div>
</aside>

<!-- ============================================================
     MAIN CHAT
     ============================================================ -->
<main class="main">
  <div class="chat-header">
    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="status"></span>
    <span id="chatTitle">New Chat</span>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="empty-state">
      <h2>Agent Chat</h2>
      <p>Type a question or task below — the agent will use its tools to help you.</p>
      <div class="empty-hints">
        <span class="empty-hint" onclick="sendHint(this.textContent)">List files in this project</span>
        <span class="empty-hint" onclick="sendHint(this.textContent)">Read hello.py and explain it</span>
        <span class="empty-hint" onclick="sendHint(this.textContent)">Count lines of Python code</span>
        <span class="empty-hint" onclick="sendHint(this.textContent)">Create a todo list for today</span>
      </div>
    </div>
  </div>

  <div class="chat-input-area">
    <div class="input-wrapper">
      <textarea
        id="userInput"
        rows="1"
        placeholder="Type a message..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <span class="label">Send</span>
        <span class="spinner"></span>
      </button>
    </div>
  </div>
</main>

</div>

<!-- ============================================================
     SCRIPT
     ============================================================ -->
<script>
// ---- STATE ----
const STATE = {
  sessions: {},        // { id: { title, messages: [] } }
  activeId: null,
  loading: false,
};

const TOOL_DESC = {
  bash: 'Shell', read_file: 'Read file', write_file: 'Write file',
  edit_file: 'Edit file', grep_search: 'Grep search', glob_search: 'Glob search',
  TodoWrite: 'Todo',
  task: 'Subagent', load_skill: 'Load skill', compress: 'Compress',
  background_run: 'BG run',
  check_background: 'BG check', task_create: 'Create task', task_get: 'Get task',
  task_update: 'Update task', task_list: 'List tasks',
  spawn_teammate: 'Spawn mate', list_teammates: 'List mates',
  send_message: 'Send msg', read_inbox: 'Read inbox', broadcast: 'Broadcast',
  shutdown_request: 'Shutdown', plan_approval: 'Plan approval',
};

// ---- INIT ----
(async function init() {
  // Load saved sessions from localStorage
  try {
    const saved = localStorage.getItem('agent_sessions');
    if (saved) STATE.sessions = JSON.parse(saved);
  } catch(e) {}

  const ids = Object.keys(STATE.sessions);
  if (ids.length > 0) {
    STATE.activeId = ids[ids.length - 1];
  } else {
    STATE.activeId = createSession();
  }

  // Fetch model info
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    document.getElementById('modelBadge').textContent = d.model || '?';
  } catch(e) {
    document.getElementById('modelBadge').textContent = 'offline';
  }

  applyTheme();
  renderAll();
})();

// ---- SESSIONS ----
function createSession() {
  const id = 's' + Date.now().toString(36);
  STATE.sessions[id] = { title: 'New Chat', messages: [] };
  return id;
}

function saveSessions() {
  localStorage.setItem('agent_sessions', JSON.stringify(STATE.sessions));
}

// ---- RENDER ----
function renderAll() {
  renderSessionList();
  renderMessages();
  document.getElementById('chatTitle').textContent =
    (STATE.activeId && STATE.sessions[STATE.activeId]?.title) || 'New Chat';
}

function renderSessionList() {
  const el = document.getElementById('sessionList');
  const ids = Object.keys(STATE.sessions);
  if (ids.length === 0) {
    el.innerHTML = '<div style="padding:16px;color:var(--text-muted);font-size:0.8rem;text-align:center">No chats yet</div>';
    return;
  }
  el.innerHTML = ids.map(id => {
    const s = STATE.sessions[id];
    const active = id === STATE.activeId ? ' active' : '';
    return `<div class="session-item${active}" onclick="switchSession('${id}')">
      <span class="dot"></span><span class="name">${escHtml(s.title)}</span>
    </div>`;
  }).join('');
}

function renderMessages() {
  const container = document.getElementById('chatMessages');
  const msgs = STATE.activeId ? (STATE.sessions[STATE.activeId]?.messages || []) : [];

  if (msgs.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <h2>Agent Chat</h2>
        <p>Type a question or task below — the agent will use its tools to help you.</p>
        <div class="empty-hints">
          <span class="empty-hint" onclick="sendHint(this.textContent)">List files in this project</span>
          <span class="empty-hint" onclick="sendHint(this.textContent)">Read hello.py and explain it</span>
          <span class="empty-hint" onclick="sendHint(this.textContent)">Count lines of Python code</span>
          <span class="empty-hint" onclick="sendHint(this.textContent)">Create a todo list for today</span>
        </div>
      </div>`;
    return;
  }

  container.innerHTML = msgs.map((m, i) => {
    if (m.role === 'user') {
      return `<div class="msg user">
        <div class="msg-avatar">👤</div>
        <div class="msg-bubble">${escHtml(m.content)}</div>
      </div>`;
    }
    if (m.role === 'assistant') {
      let body = '';
      // Tool calls
      if (m.toolCalls && m.toolCalls.length > 0) {
        body += m.toolCalls.map(tc => {
          const desc = TOOL_DESC[tc.tool] || '';
          const output = tc.output || tc.summary || '';
          return `<div class="tool-call">
            <div class="tool-name" onclick="this.nextElementSibling.classList.toggle('open')" style="cursor:pointer">
              <span class="indicator"></span>${escHtml(tc.tool)}
              ${desc ? `<span style="font-weight:400;color:var(--text-muted);font-size:0.7rem;margin-left:6px">${escHtml(desc)}</span>` : ''}
            </div>
            ${output ? `<div class="tool-detail collapsible">${escHtml(output)}</div>` : ''}
          </div>`;
        }).join('');
      }
      // Text content
      if (m.content) {
        body += `<div class="msg-bubble">${renderMarkdown(m.content)}</div>`;
      }
      if (!body) body = '<div class="msg-bubble" style="color:var(--text-muted)">(thinking…)</div>';
      return `<div class="msg assistant">
        <div class="msg-avatar">🤖</div>
        <div style="display:flex;flex-direction:column;gap:6px">${body}</div>
      </div>`;
    }
    return '';
  }).join('');

  container.scrollTop = container.scrollHeight;
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = escHtml(text);
  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Newlines
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

// ---- ACTIONS ----
function switchSession(id) {
  STATE.activeId = id;
  renderAll();
}

function newChat() {
  const id = createSession();
  STATE.activeId = id;
  saveSessions();
  renderAll();
}

function sendHint(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

async function sendMessage() {
  if (STATE.loading) return;
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;

  // Ensure we have an active session
  if (!STATE.activeId || !STATE.sessions[STATE.activeId]) {
    STATE.activeId = createSession();
  }

  const session = STATE.sessions[STATE.activeId];
  const currentSessionId = STATE.activeId;

  // Update title from first message
  if (session.messages.length === 0) {
    session.title = text.slice(0, 60) + (text.length > 60 ? '\u2026' : '');
  }

  // Add user message
  session.messages.push({ role: 'user', content: text });
  saveSessions();
  renderAll();

  // Clear input
  input.value = '';
  autoResize(input);

  // Set loading state
  STATE.loading = true;
  const btn = document.getElementById('sendBtn');
  btn.classList.add('loading');
  btn.disabled = true;

  // Pending assistant message for streaming
  let pendingMsg = { role: 'assistant', content: '', toolCalls: [] };
  let currentAssistantEl = null;

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, session_id: currentSessionId }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Error ${res.status}`);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let streamSessionId = currentSessionId;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // Parse SSE events (separated by double newlines)
      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const rawEvent = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);

        let eventType = 'message';
        let eventData = {};
        for (const line of rawEvent.split('\n')) {
          if (line.startsWith('event: ')) eventType = line.slice(7).trim();
          else if (line.startsWith('data: ')) {
            try { eventData = JSON.parse(line.slice(6)); } catch(e) {}
          }
        }

        handleStreamEvent(eventType, eventData, pendingMsg, session, streamSessionId);

        // Sync session ID if server assigned one
        if (eventType === 'session' && eventData.session_id) {
          streamSessionId = eventData.session_id;
          if (streamSessionId !== STATE.activeId) {
            STATE.sessions[streamSessionId] = session;
            delete STATE.sessions[STATE.activeId];
            STATE.activeId = streamSessionId;
          }
        }

        // Progressive render (keeps scroll position)
        updateStreamingMessage(pendingMsg, streamSessionId);
      }
    }

    // Finalize
    session.messages.push(pendingMsg);

  } catch (err) {
    if (!pendingMsg.content && pendingMsg.toolCalls.length === 0) {
      pendingMsg.content = `\u26a0\ufe0f Error: ${err.message}`;
    }
    session.messages.push(pendingMsg);
  } finally {
    STATE.loading = false;
    btn.classList.remove('loading');
    btn.disabled = false;
    saveSessions();
    renderAll();
    input.focus();
  }
}

// ---- STREAM EVENT HANDLING ----
function handleStreamEvent(type, data, msg, session, sid) {
  if (type === 'tool_call') {
    msg.toolCalls.push({
      tool: data.name,
      input: data.input,
      output: '',
      _running: true,
    });
  } else if (type === 'tool_result') {
    // Match by name (last running card with same tool name)
    for (let i = msg.toolCalls.length - 1; i >= 0; i--) {
      if (msg.toolCalls[i].tool === data.name && msg.toolCalls[i]._running) {
        msg.toolCalls[i].output = data.output || '';
        msg.toolCalls[i]._running = false;
        break;
      }
    }
  } else if (type === 'text') {
    msg.content += (msg.content ? '\n\n' : '') + (data.text || '');
  } else if (type === 'status') {
    msg.content += (msg.content ? '\n\n' : '') + `_${data.message}_`;
  } else if (type === 'error') {
    msg.content += (msg.content ? '\n\n' : '') + `\u26a0\ufe0f Error: ${data.message}`;
  }
}

function updateStreamingMessage(msg, sid) {
  const container = document.getElementById('chatMessages');

  // Create assistant element on first call
  let assistantEl = document.getElementById('__streaming_msg');
  if (!assistantEl) {
    // Clear empty state if present
    const empty = container.querySelector('.empty-state');
    if (empty) empty.remove();

    assistantEl = document.createElement('div');
    assistantEl.className = 'msg assistant';
    assistantEl.id = '__streaming_msg';
    assistantEl.innerHTML = '<div class="msg-avatar">\ud83e\udd16</div><div class="msg-body" style="display:flex;flex-direction:column;gap:6px"><div class="thinking"><span class="pulse-dot"></span>Thinking...</div></div>';
    container.appendChild(assistantEl);
  }

  const body = assistantEl.querySelector('.msg-body');
  let html = '';

  // Render tool calls
  msg.toolCalls.forEach(tc => {
    const desc = TOOL_DESC[tc.tool] || '';
    const dotColor = tc._running ? 'var(--amber)' : 'var(--green)';
    html += `<div class="tool-call">
      <div class="tool-name" onclick="this.nextElementSibling.classList.toggle('open')" style="cursor:pointer">
        <span class="indicator" style="background:${dotColor}"></span>${escHtml(tc.tool)}
        ${desc ? `<span style="font-weight:400;color:var(--text-muted);font-size:0.7rem;margin-left:6px">${escHtml(desc)}</span>` : ''}
      </div>
      ${tc.output ? `<div class="tool-detail collapsible open">${escHtml(tc.output)}</div>` : ''}
    </div>`;
  });

  // Render text or thinking
  if (msg.content) {
    html += `<div class="msg-bubble">${renderMarkdown(msg.content)}</div>`;
  } else if (msg.toolCalls.length === 0) {
    html = '<div class="thinking"><span class="pulse-dot"></span>Thinking...</div>';
  }

  body.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

// ---- HELPERS ----
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ---- THEME ----
function toggleTheme() {
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  localStorage.setItem('chat_theme', html.dataset.theme);
}

function applyTheme() {
  const theme = localStorage.getItem('chat_theme') || 'dark';
  document.documentElement.dataset.theme = theme;
  document.getElementById('themeBtn').textContent = theme === 'light' ? '🌙 Dark' : '☀️ Light';
}

// ---- MOBILE ----
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
</script>
