name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-test:
    runs-on: ubuntu-latest

    # agents/config.py requires MODEL_ID at import time and the Anthropic
    # SDK requires an API key at client construction. The repo's .env is
    # gitignored, so CI provides minimal placeholders (tests inject fake
    # clients and never make real API calls).
    #
    # AGENT_SANDBOX_BACKEND=none: create_sandbox() defaults to DockerSandbox
    # when Docker is available, but most unit tests call bash with
    # sys.executable (a HOST path that does not exist inside a container).
    # Forcing NoOpSandbox keeps the CI test baseline identical to local
    # (non-Docker) runs. Docker-specific tests construct DockerSandbox
    # explicitly and still exercise the real daemon.
    env:
      MODEL_ID: test-model
      ANTHROPIC_API_KEY: ci-placeholder
      AGENT_SANDBOX_BACKEND: none

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q --ignore=tests/integration --ignore=tests/eval --ignore=tests/test_frontend_server.py
