[pytest]
# All pytest-generated files go under .tmp/
cache_dir = .tmp/.pytest_cache

# pytest-benchmark output
benchmark_save = .tmp/.benchmarks

# Eval tests require an API key and are excluded from normal CI runs.
# Run them explicitly:  pytest tests/eval/ -m eval
markers =
    eval: LLM evaluation tests requiring API key (deselect with '-m "not eval"')
addopts = --ignore=tests/eval
